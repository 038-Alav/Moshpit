services:
  postgres:
    image: postgres:17-alpine
    container_name: moshpit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moshpit}
      POSTGRES_USER: ${POSTGRES_USER:-moshpit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moshpit_dev}
    ports:
      - "5432:5432"
    volumes:
      - moshpit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    container_name: moshpit-centrifugo
    restart: unless-stopped
    command: ["centrifugo", "-c", "config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:-local-dev-token-secret-change-before-use}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-local-dev-api-key-change-before-use}
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: moshpit-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-moshpit}:${POSTGRES_PASSWORD:-moshpit_dev}@postgres:5432/${POSTGRES_DB:-moshpit}
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-local-dev-api-key-change-before-use}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:-local-dev-token-secret-change-before-use}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  moshpit-postgres-data:
